name: Build RIT.app (Apple Silicon)

# Builds the Apple-Silicon RIT.app on a GitHub macos-14 (Apple Silicon) runner and
# packages a .dmg. The runner can BUILD + SIGN but cannot boot the inner VM (no
# nested virtualization), so this verifies/produces the app; the functional
# VM-boot test is the rare bare-metal step (validated live on M3 Max / macOS 26).
#
# Ad-hoc signs by default. Set repo secret CODESIGN_IDENTITY (+ NOTARY_*) and the
# build signs/notarizes for distribution.

on:
  workflow_dispatch:
  push:
    branches: [arm64-and-httpsys-tests]
    paths:
      - .github/workflows/build-mac-silicon.yml
      - v2/macos/RITApp/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15          # Xcode 16 / Swift 6 by default (RoyalVNC needs Swift 6.0)
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Swift 6)
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer" || true
          swift --version

      - name: Build RIT.app (Swift + RoyalVNC -> bundle)
        env:
          SIGN_ID: ${{ secrets.CODESIGN_IDENTITY }}   # empty -> ad-hoc
        run: |
          cd v2/macos/RITApp
          chmod +x build-app.sh
          ./build-app.sh

      - name: Package .dmg
        run: |
          hdiutil create -volname "Rotman Interactive Trader" \
            -srcfolder v2/macos/RITApp/build/RIT.app -ov -format UDZO \
            RIT-mac-apple-silicon.dmg
          ls -la RIT-mac-apple-silicon.dmg

      - name: Notarize + staple (when signing creds are set)
        env:
          SIGN_ID: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$SIGN_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "No signing/notary creds set — ad-hoc build, skipping notarization."; exit 0
          fi
          xcrun notarytool submit RIT-mac-apple-silicon.dmg \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple RIT-mac-apple-silicon.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: RIT-mac-apple-silicon
          path: RIT-mac-apple-silicon.dmg
