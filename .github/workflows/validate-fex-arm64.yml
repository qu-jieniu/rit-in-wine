name: Validate Rosetta-free arm64 (Wine + FEX)

# Proves the Rosetta-free Apple-Silicon stack for RIT: x86 RIT running on ARM64
# via FEX-Emu, no Rosetta, no CrossOver. The win32 prefix (+.NET 4.8 +RIT) is
# baked natively on amd64 and pushed to GHCR; the arm64 job installs FEX's
# binfmt handlers and runs that x86 image transparently under FEX (the container
# supplies the x86 libs, so no FEX RootFS is needed), then asserts the REST API.
#
# EXPERIMENTAL: arm64-Wine+FEX for a 32-bit .NET app is bleeding edge; expect
# iteration from the CI logs.

on:
  workflow_dispatch:
  # Temporary: trigger from the feature branch before PR #1 merges.
  push:
    branches: [arm64-and-httpsys-tests]
    paths: [.github/workflows/validate-fex-arm64.yml]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/rit-prefix

jobs:
  bake-prefix:
    name: Bake x86 RIT image (amd64, native)
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "ref=${IMAGE,,}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build win32 prefix with RIT installed
        run: |
          docker build -f test/Dockerfile.prefix    --build-arg WINEARCH=win32 -t p1 test
          docker build -f test/Dockerfile.slim       --build-arg BASE=p1 -t p2 test
          docker build -f test/Dockerfile.installed  --build-arg BASE=p2 -t "${{ steps.meta.outputs.ref }}" test
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.meta.outputs.ref }}"

  fex-arm64:
    name: Run RIT under FEX (arm64, Rosetta-free)
    needs: bake-prefix
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install FEX-Emu + binfmt handlers
        run: |
          sudo add-apt-repository -y ppa:fex-emu/fex
          sudo apt-get update
          sudo apt-get install -y fex-emu-armv8.0 fex-emu-binfmt32 fex-emu-binfmt64
          echo "=== registered binfmt handlers ==="
          ls /proc/sys/fs/binfmt_misc/ | grep -iE "fex|x86|i386" || true
          for h in /proc/sys/fs/binfmt_misc/FEX-x86 /proc/sys/fs/binfmt_misc/FEX-x86_64; do
            [ -f "$h" ] && { echo "--- $h ---"; cat "$h"; }
          done

      - name: Sanity — run a stock amd64 image under FEX
        run: docker run --rm --platform linux/amd64 ubuntu:24.04 bash -c 'echo "amd64 under FEX: $(uname -m)"; cat /etc/os-release | head -1'

      - name: Run RIT under FEX and assert the API responds
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "${{ needs.bake-prefix.outputs.ref }}"
          docker run --rm --platform linux/amd64 --security-opt seccomp=unconfined --shm-size=1g \
            --entrypoint bash "${{ needs.bake-prefix.outputs.ref }}" -c '
              set -u
              export WINEPREFIX=/opt/rit-prefix WINEARCH=win32 WINEDEBUG=-all
              export WINEDLLOVERRIDES="mscoree=n;mshtml=d" DISPLAY=:99 HOME=/root XDG_RUNTIME_DIR=/tmp/xdg
              mkdir -p /tmp/xdg
              Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & sleep 3
              CLIENT="$WINEPREFIX/drive_c/Program Files/Rotman/RIT User Application/Client.exe"
              echo "== launching RIT under FEX (slow; .NET JIT-on-JIT) =="
              wine "$CLIENT" >/tmp/rit.log 2>&1 &
              ok=0
              for i in $(seq 1 90); do
                sleep 5
                ss -ltn 2>/dev/null | grep -q ":9999" && { echo ":9999 listening after $((i*5))s"; ok=1; break; }
              done
              timeout 15 curl -s -o /dev/null -w "API: HTTP %{http_code} in %{time_total}s\n" \
                http://127.0.0.1:9999/v1/case || echo "API: no response"
              echo "== rit.log tail =="; tail -30 /tmp/rit.log
              wineserver -k 2>/dev/null || true
              test "$ok" = 1
            '
