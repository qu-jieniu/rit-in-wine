name: Validate Rosetta-free arm64 (Wine + FEX)

# Proves the Rosetta-free Apple-Silicon stack for RIT: x86 RIT running on ARM64
# via FEX-Emu, no Rosetta, no CrossOver.
#
# FEX is not container-friendly (it needs its own RootFS, not the container fs),
# so we DON'T run the x86 image under binfmt. Instead we export the x86 image's
# filesystem as a FEX RootFS and run RIT via FEXBash against it.
#
# EXPERIMENTAL: arm64-Wine+FEX for a 32-bit .NET app is bleeding edge.

on:
  workflow_dispatch:
  push:
    branches: [arm64-and-httpsys-tests]
    paths: [.github/workflows/validate-fex-arm64.yml]

permissions:
  contents: read
  packages: write

env:
  REF: ghcr.io/qu-jieniu/rit-in-wine/rit-prefix:win32

jobs:
  bake-prefix:
    name: Bake x86 RIT image (amd64) — reuse if present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push only if the stable tag is missing
        run: |
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "reusing existing $REF"; exit 0
          fi
          docker build -f test/Dockerfile.prefix    --build-arg WINEARCH=win32 -t p1 test
          docker build -f test/Dockerfile.slim       --build-arg BASE=p1 -t p2 test
          docker build -f test/Dockerfile.installed  --build-arg BASE=p2 -t "$REF" test
          docker push "$REF"

  fex-arm64:
    name: Run RIT under FEX (arm64, Rosetta-free)
    needs: bake-prefix
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install FEX-Emu + binfmt handlers
        run: |
          sudo add-apt-repository -y ppa:fex-emu/fex
          sudo apt-get update
          sudo apt-get install -y fex-emu-armv8.0 fex-emu-binfmt32 fex-emu-binfmt64
          ls /proc/sys/fs/binfmt_misc/ | grep -i fex || true

      - name: Export the x86 image to a chroot
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "$REF"
          cid=$(docker create --platform linux/amd64 "$REF")
          sudo mkdir -p /opt/x86root
          docker export "$cid" | sudo tar -C /opt/x86root -xf -
          docker rm "$cid"
          CX="/opt/x86root/opt/rit-prefix/drive_c/Program Files/Rotman/RIT User Application/Client.exe"
          test -f "$CX" && echo "Client.exe present ($(stat -c%s "$CX") bytes)" || { echo "MISSING"; exit 1; }
          test -f /opt/x86root/opt/wine-stable/share/wine/wine.inf && echo "wine.inf present in chroot"

      - name: Run RIT under FEX via chroot, assert the API responds
        run: |
          ROOT=/opt/x86root
          # Bind the kernel filesystems the guest needs (Xvfb, wine, sockets).
          sudo mount -t proc  proc  "$ROOT/proc"
          sudo mount --rbind  /sys  "$ROOT/sys"
          sudo mount --rbind  /dev  "$ROOT/dev"
          sudo mount -t tmpfs tmpfs "$ROOT/tmp"
          # Tell FEX the x86 rootfs is the chroot itself ("/"), so guest file I/O
          # for wine.inf / drivers / the prefix all resolve to real x86 files.
          sudo mkdir -p "$ROOT/root/.fex-emu"
          echo '{"Config":{"RootFS":"/"}}' | sudo tee "$ROOT/root/.fex-emu/Config.json" >/dev/null
          sudo tee "$ROOT/run.sh" >/dev/null <<'SH'
          set -u
          export WINEPREFIX=/opt/rit-prefix WINEARCH=win32 WINEDEBUG=-all
          export WINEDLLOVERRIDES="mscoree=n;mshtml=d" DISPLAY=:99 HOME=/root XDG_RUNTIME_DIR=/tmp/xdg
          export PATH=/opt/wine-stable/bin:/usr/bin:/bin
          mkdir -p /tmp/xdg
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & sleep 3
          CLIENT="$WINEPREFIX/drive_c/Program Files/Rotman/RIT User Application/Client.exe"
          echo "== chroot guest sees: =="
          head -c 40 /opt/wine-stable/share/wine/wine.inf >/dev/null 2>&1 && echo "  wine.inf readable" || echo "  wine.inf NOT readable"
          ls /opt/wine-stable/lib/wine/i386-unix/winex11.so >/dev/null 2>&1 && echo "  winex11.so present" || echo "  winex11.so MISSING"
          echo "== launching RIT under FEX (slow; .NET JIT-on-JIT) =="
          wine "$CLIENT" >/tmp/rit.log 2>&1 &
          ok=0
          for i in $(seq 1 90); do
            sleep 5
            ss -ltn 2>/dev/null | grep -q ":9999" && { echo ":9999 listening after $((i*5))s"; ok=1; break; }
          done
          timeout 15 curl -s -o /dev/null -w "API: HTTP %{http_code} in %{time_total}s\n" \
            http://127.0.0.1:9999/v1/case || echo "API: no response"
          echo "== rit.log tail =="; tail -30 /tmp/rit.log
          wineserver -k 2>/dev/null || true
          test "$ok" = 1
          SH
          # x86 binaries inside the chroot execute transparently via the FEX binfmt handler.
          sudo chroot "$ROOT" /bin/bash /run.sh
