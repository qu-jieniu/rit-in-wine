name: Validate Rosetta-free arm64 (Wine + FEX)

# Proves the Rosetta-free Apple-Silicon stack for RIT: x86 RIT running on ARM64
# via FEX-Emu, no Rosetta, no CrossOver.
#
# FEX is not container-friendly (it needs its own RootFS, not the container fs),
# so we DON'T run the x86 image under binfmt. Instead we export the x86 image's
# filesystem as a FEX RootFS and run RIT via FEXBash against it.
#
# EXPERIMENTAL: arm64-Wine+FEX for a 32-bit .NET app is bleeding edge.

on:
  workflow_dispatch:
  push:
    branches: [arm64-and-httpsys-tests]
    paths: [.github/workflows/validate-fex-arm64.yml]

permissions:
  contents: read
  packages: write

env:
  REF: ghcr.io/qu-jieniu/rit-in-wine/rit-prefix:win32

jobs:
  bake-prefix:
    name: Bake x86 RIT image (amd64) — reuse if present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push only if the stable tag is missing
        run: |
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "reusing existing $REF"; exit 0
          fi
          docker build -f test/Dockerfile.prefix    --build-arg WINEARCH=win32 -t p1 test
          docker build -f test/Dockerfile.slim       --build-arg BASE=p1 -t p2 test
          docker build -f test/Dockerfile.installed  --build-arg BASE=p2 -t "$REF" test
          docker push "$REF"

  fex-arm64:
    name: Run RIT under FEX (arm64, Rosetta-free)
    needs: bake-prefix
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install FEX-Emu + a native (arm64) Xvfb
        run: |
          sudo add-apt-repository -y ppa:fex-emu/fex
          sudo apt-get update
          sudo apt-get install -y fex-emu-armv8.0 xvfb x11-utils

      - name: Export the x86 image as a FEX RootFS (canonical location)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "$REF"
          cid=$(docker create --platform linux/amd64 "$REF")
          # FEX auto-detects rootfs dirs under ~/.fex-emu/RootFS/<name>.
          mkdir -p ~/.fex-emu/RootFS
          sudo mkdir -p ~/.fex-emu/RootFS/rit
          docker export "$cid" | sudo tar -C ~/.fex-emu/RootFS/rit -xf -
          docker rm "$cid"
          sudo chown -R "$(id -u):$(id -g)" ~/.fex-emu
          # Prefix must be writable -> keep it outside the (read-only) rootfs, at
          # its bake path, as a host-passthrough copy.
          sudo mv ~/.fex-emu/RootFS/rit/opt/rit-prefix /opt/rit-prefix
          sudo chown -R "$(id -u):$(id -g)" /opt/rit-prefix
          # Wine's case-insensitive NtCreateFile traversal fails on rootfs dirs
          # under FEX (host-passthrough dirs work). Move the whole Wine install to
          # a host-passthrough path so wine.inf + fonts resolve.
          sudo mv ~/.fex-emu/RootFS/rit/opt/wine-stable /opt/wine-stable
          sudo chown -R "$(id -u):$(id -g)" /opt/wine-stable
          # Canonical config: RootFS is the NAME (resolved under ~/.fex-emu/RootFS/),
          # not an absolute path (the bug last time).
          printf '{"Config":{"RootFS":"rit"}}\n' > ~/.fex-emu/Config.json
          echo "rootfs + config ready"; cat ~/.fex-emu/Config.json

      - name: Run RIT under FEX (FEXBash) and assert the API responds
        run: |
          # Native arm64 Xvfb on the host, listening on TCP so the FEX guest can
          # reach it (the x86 Xvfb wouldn't start under FEX). -ac = no access control.
          Xvfb :99 -screen 0 1280x800x24 -listen tcp -ac >/tmp/xvfb.log 2>&1 &
          sleep 3
          pgrep -a Xvfb && echo "host Xvfb up" || { echo "host Xvfb failed"; cat /tmp/xvfb.log; exit 1; }
          cat > /tmp/run.sh <<'SH'
          set -u
          export WINEPREFIX=/opt/rit-prefix WINEARCH=win32 WINEDEBUG=-all
          export WINEDLLOVERRIDES="mscoree=n;mshtml=d" DISPLAY=127.0.0.1:99 HOME=/root XDG_RUNTIME_DIR=/tmp/xdg
          export WINELOADER=/opt/wine-stable/bin/wine PATH=/opt/wine-stable/bin:/usr/bin:/bin
          mkdir -p /tmp/xdg
          CLIENT="$WINEPREFIX/drive_c/Program Files/Rotman/RIT User Application/Client.exe"
          echo "== guest can now read rootfs files? =="
          head -c 40 /opt/wine-stable/share/wine/wine.inf >/dev/null 2>&1 && echo "  wine.inf READABLE" || echo "  wine.inf NOT readable"
          ls /opt/wine-stable/lib/wine/i386-unix/winex11.so >/dev/null 2>&1 && echo "  winex11.so present" || echo "  winex11.so MISSING"
          ls /opt/rit-prefix/drive_c >/dev/null 2>&1 && echo "  prefix readable" || echo "  prefix NOT readable"
          echo "== explicit wineboot -u with file trace (find the real missing path) =="
          WINEDEBUG=+file timeout 120 wine wineboot -u >/tmp/wineboot.log 2>&1; echo "  wineboot rc=$?"
          grep -iE "wine.inf|No such|cannot open|Z:|update" /tmp/wineboot.log | tail -12
          echo "== fonts present? =="
          ls "$WINEPREFIX/drive_c/windows/Fonts" 2>&1 | head -3
          ls /opt/wine-stable/share/wine/fonts 2>&1 | head -3
          echo "== display state =="
          pgrep -a Xvfb || echo "  Xvfb NOT running"
          ls -la /tmp/.X11-unix/ 2>&1 | head
          echo "== why won't winex11 load? (x11drv trace) =="
          WINEDEBUG=+x11drv,+winediag timeout 40 wine winecfg >/tmp/x11.log 2>&1 || true
          grep -aiE "x11drv|XOpenDisplay|cannot|failed|libX11|no display|driver" /tmp/x11.log | head -12
          echo "== launching RIT under FEX (slow; .NET JIT-on-JIT) =="
          wine "$CLIENT" >/tmp/rit.log 2>&1 &
          ok=0
          for i in $(seq 1 90); do
            sleep 5
            ss -ltn 2>/dev/null | grep -q ":9999" && { echo ":9999 listening after $((i*5))s"; ok=1; break; }
          done
          timeout 15 curl -s -o /dev/null -w "API: HTTP %{http_code} in %{time_total}s\n" \
            http://127.0.0.1:9999/v1/case || echo "API: no response"
          echo "== rit.log tail =="; tail -30 /tmp/rit.log
          wineserver -k 2>/dev/null || true
          test "$ok" = 1
          SH
          # place the script inside the rootfs so the guest sees it at /run.sh
          cp /tmp/run.sh ~/.fex-emu/RootFS/rit/run.sh
          FEXBash -c 'bash /run.sh'
