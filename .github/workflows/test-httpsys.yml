name: http.sys API test (upstream Wine, no CrossOver)

# Proves RIT's REST API path (a "http://*:PORT/" HttpListener registration)
# works under upstream Wine, with no CrossOver, no .NET, no winetricks.
#
#   x86_64-native : Wine 11 on amd64 hardware. Asserts stock Wine PASSES and a
#                   deliberately-broken driver FAILS (so the test isn't vacuous).
#   arm64-emulated: the SAME x86_64 Wine image run under emulation on arm64
#                   hardware -- the Rosetta-free Apple-Silicon model (x86 app on
#                   arm64 via an x86 emulator + upstream Wine).

on:
  push:
    paths:
      - test/**
      - .github/workflows/test-httpsys.yml
  pull_request:
    paths:
      - test/**
      - .github/workflows/test-httpsys.yml
  workflow_dispatch:

jobs:
  x86_64-native:
    name: x86_64 (native, Wine 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f test/Dockerfile.x86_64 -t rit-httptest:x86_64 test

      - name: Stock upstream Wine must serve the API (PASS)
        run: docker run --rm rit-httptest:x86_64 stock

      - name: Patched driver must also serve the API (PASS)
        run: docker run --rm rit-httptest:x86_64 patched

      - name: Deliberately-broken driver must hang (FAIL) -- guards against a vacuous test
        run: |
          if docker run --rm \
               -v "$PWD/test/drivers/x86_64/http.sys.buggy:/test/http.sys:ro" \
               rit-httptest:x86_64 patched; then
            echo "::error::buggy driver unexpectedly PASSED -- the test does not detect the bug"
            exit 1
          else
            echo "buggy driver failed as expected -- test is meaningful"
          fi

  arm64-emulated:
    name: arm64 (emulated x86_64, Rosetta-free model)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Register x86_64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64

      - name: Build the x86_64 test image (under emulation)
        run: docker build --platform linux/amd64 -f test/Dockerfile.x86_64 -t rit-httptest:x86_64 test

      - name: Stock upstream Wine must serve the API on arm64-via-emulation (PASS)
        run: docker run --rm --platform linux/amd64 rit-httptest:x86_64 stock
