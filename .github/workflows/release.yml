name: Release builds

# Builds the four download assets and attaches them to a GitHub Release:
#   RIT-x86_64.AppImage · RIT-aarch64.AppImage · RIT-mac-intel.dmg · RIT-mac-apple-silicon.dmg
# Linux x86_64 + Apple Silicon are verified; arm64 is wired (needs CI iteration);
# Intel is gated until the from-source Wine recipe lands.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Linux x86_64: portable stock-Wine AppImage (verified) ----------
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build prefix pipeline -> minimal payload -> AppImage
        run: |
          docker build -f test/Dockerfile.prefix    --build-arg WINEARCH=win32 -t p1 test
          docker build -f test/Dockerfile.slim       --build-arg BASE=p1 -t p2 test
          docker build -f test/Dockerfile.installed  --build-arg BASE=p2 -t rit-prefix:installed test
          docker build -f v2/minimal/Dockerfile      --build-arg BASE=rit-prefix:installed -t rit-v2-min v2/minimal
          CRT=docker bash appimage/build-appimage.sh
      - name: Smoke test (boots RIT, API binds)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb >/dev/null
          Xvfb :99 -screen 0 1280x800x24 -ac >/dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 appimage/out/RIT-x86_64.AppImage >/tmp/rit.log 2>&1 &
          for i in $(seq 1 40); do sleep 5; ss -ltn | grep -q :9999 && { echo "API up"; ok=1; break; }; done
          [ "${ok:-0}" = 1 ] || { echo "no API"; tail -20 /tmp/rit.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: RIT-x86_64.AppImage, path: appimage/out/RIT-x86_64.AppImage }

  # ---------- Linux arm64: FEX + stock-Wine AppImage (wired; needs CI iteration) ----------
  linux-arm64:
    if: ${{ vars.ENABLE_ARM64 == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR (payload pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build arm64 AppImage (FEX + amd64 payload)
        run: CRT=docker bash appimage/build-appimage-arm64.sh
      - uses: actions/upload-artifact@v4
        with: { name: RIT-aarch64.AppImage, path: appimage/out/RIT-aarch64.AppImage }

  # ---------- Apple Silicon: RIT.app .dmg (verified build) ----------
  mac-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer" || true
      - name: Build RIT.app + .dmg
        env: { SIGN_ID: "${{ secrets.CODESIGN_IDENTITY }}" }
        run: |
          cd v2/macos/RITApp && chmod +x build-app.sh && ./build-app.sh
          hdiutil create -volname "Rotman Interactive Trader" \
            -srcfolder build/RIT.app -ov -format UDZO "$GITHUB_WORKSPACE/RIT-mac-apple-silicon.dmg"
      - name: Notarize (when creds set)
        env:
          SIGN_ID: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          [ -z "$SIGN_ID" ] || [ -z "$NOTARY_PASSWORD" ] && { echo "ad-hoc, skipping notarize"; exit 0; }
          xcrun notarytool submit RIT-mac-apple-silicon.dmg --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple RIT-mac-apple-silicon.dmg
      - uses: actions/upload-artifact@v4
        with: { name: RIT-mac-apple-silicon.dmg, path: RIT-mac-apple-silicon.dmg }

  # ---------- Intel Mac: native stock-Wine .dmg (gated until from-source Wine) ----------
  mac-intel:
    if: ${{ vars.ENABLE_MAC_INTEL == 'true' }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO mac/build-wine-from-source.sh + mac/build-intel-app.sh"

  # ---------- Attach everything to the Release ----------
  publish:
    needs: [linux-x86_64, linux-arm64, mac-silicon, mac-intel]
    if: ${{ always() && github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/RIT-x86_64.AppImage
            dist/RIT-aarch64.AppImage
            dist/RIT-mac-apple-silicon.dmg
            dist/RIT-mac-intel.dmg
