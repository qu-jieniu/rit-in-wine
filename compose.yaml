services:
  rit-in-wine:
    build: .
    image: localhost/rit-in-wine:latest
    container_name: rit-in-wine
    security_opt:
      - seccomp:unconfined
    env_file: .env
    volumes:
      - ./config:/config
    ports:
      - "3010:3000"
      - "3011:3001"
      # RIT desktop client's local REST API.
      # Host port 9999 is taken by Stash, so we expose 9991.
      # Note: as of wine 10 the .NET HttpListener inside the client
      # accepts requests but never writes the response — this mapping
      # is here for future Wine fixes / non-Wine images.
      - "9991:9999"
    shm_size: "2gb"
    restart: unless-stopped
